name: Universal APK Builder & Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Siapkan project
        shell: bash
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE/_src"
          mkdir -p "$SRC"

          find_root() {
            find "$1" -maxdepth 6 \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.git/*' -not -path '*/_src/*' -not -path '*/__MACOSX/*' \
              -not -path '*/build/*' -printf '%d %h\n' 2>/dev/null | sort -n | head -n1 | cut -d' ' -f2-
          }

          ROOT=$(find_root "$GITHUB_WORKSPACE")
          if [ -z "$ROOT" ]; then
            ROOT=$(find "$SRC" -maxdepth 6 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' -printf '%d %h\n' | sort -n | head -n1 | cut -d' ' -f2-)
          fi

          if [ -z "$ROOT" ]; then
            i=0
            while IFS= read -r z; do
              i=$((i+1))
              echo "Ekstrak: $z"
              unzip -o -q "$z" -d "$SRC/z$i" || true
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 2 -iname '*.zip' -not -path '*/.git/*' -not -path '*/_src/*')

            for round in 1 2 3; do
              ROOT=$(find "$SRC" -maxdepth 6 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' -printf '%d %h\n' | sort -n | head -n1 | cut -d' ' -f2-)
              [ -n "$ROOT" ] && break
              found=0
              while IFS= read -r z; do
                [ -d "$z.x" ] && continue
                found=1
                echo "Ekstrak zip dalam: $z"
                unzip -o -q "$z" -d "$z.x" || true
              done < <(find "$SRC" -maxdepth 6 -iname '*.zip')
              [ "$found" = 0 ] && break
            done
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::settings.gradle(.kts) tidak ditemukan."
            exit 1
          fi

          echo "Project root: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Cari APK dan tentukan nama dinamis
        id: ver
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -n1)
          [ -n "$APK" ] || { echo "::error::APK tidak ditemukan"; exit 1; }
          
          VN=$(grep -rhoE 'versionName *= *"[^"]+"' --include=build.gradle.kts --include=build.gradle . | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VN=${VN:-0}
          
          # MENDETEKSI NAMA PROYEK OTOMATIS
          APP_NAME=$(grep -m 1 'rootProject.name' settings.gradle.kts settings.gradle 2>/dev/null | sed -E 's/.*= *["'\''](.*)["'\'']/\1/' | tr -d '[:space:]')
          APP_NAME=${APP_NAME:-UniversalApp}
          
          cp "$APK" "$GITHUB_WORKSPACE/${APP_NAME}-v${VN}-${{ github.run_number }}.apk"
          echo "apk=${APP_NAME}-v${VN}-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=v${VN}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.app_name }}-apk
          path: ${{ steps.ver.outputs.apk }}

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.app_name }} ${{ steps.ver.outputs.tag }}
          files: ${{ steps.ver.outputs.apk }}
